
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Magic | Khelearn</title>
  <link rel="stylesheet" href="memory.css">
</head>
<body>

  <header class="game-header">
    <a href="index.html" class="logo">🧠 Brain<span>Boost</span></a>
    <a href="index.html" class="home-button">🏠 Home</a>
  </header>

  <main class="game-container">

    <div class="game-intro">
      <span class="tag">🌈 BRAIN TRAINING ADVENTURE</span>
      <h1>🧩 Memory Magic!</h1>
      <p>Flip the cards and find matching pictures!</p>
    </div>

    <section class="difficulty">
      <h2>Choose your level</h2>

      <div class="level-buttons">
        <button class="level-btn active" data-level="easy">
          🌱 Easy
        </button>
        <button class="level-btn" data-level="medium">
          ⭐ Medium
        </button>
        <button class="level-btn" data-level="hard">
          🚀 Hard
        </button>
      </div>
    </section>

    
<section class="score-board">

  <div class="score-box">
    <span>⭐</span>
    <p>Stars</p>
    <strong id="stars">0</strong>
  </div>

  <div class="score-box">
    <span>🎯</span>
    <p>Matches</p>
    <strong id="matches">0</strong>
  </div>

  <div class="score-box">
    <span>👣</span>
    <p>Moves</p>
    <strong id="moves">0</strong>
  </div>

  <div class="score-box">
    <span>🏆</span>
    <p>Best Moves</p>
    <strong id="bestScore">--</strong>
  </div>

</section>


    <section class="board-section">
       <div id="gameBoard" class="game-board"></div>

<div class="game-controls">

  <button id="restartButton" class="restart-button">
    🔄 Restart Game
  </button>

  <button id="soundButton" class="restart-button">
    🔊 Sound On
  </button>

    </div>

    <section class="message-area">
      <p id="gameMessage" aria-live="polite">
        Let's find some matching pictures! 💜
      </p>
    </section>

    <section id="winMessage" class="win-message" hidden>
      <div class="win-content">
        <div class="celebration">🏆🎉🌟</div>
        <h2>Amazing Job, Little Genius!</h2>
        <p>You found all the matching pictures!</p>
        <div id="finalStars"></div>
        <button id="playAgainButton">
          Play Again 🚀
        </button>
      </div>
    </section>

  </main>

  <script src="memory.js"></script>
</body>
</html>
